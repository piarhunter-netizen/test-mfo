# nginx: /etc/nginx/sites-available/mfo-site
# Сертификат: certbot certonly --nginx -d vietrp.com -d www.vietrp.com (продлевается certbot.timer)

# Лимиты частоты запросов к API (на адрес клиента)
limit_req_zone $binary_remote_addr zone=mfo_api:10m rate=5r/s;
limit_req_status 429;

# HTTP и обращения по IP — на https://vietrp.com
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://vietrp.com$request_uri; }
}

# www → без www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.vietrp.com;
    ssl_certificate /etc/letsencrypt/live/vietrp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vietrp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://vietrp.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vietrp.com;
    ssl_certificate /etc/letsencrypt/live/vietrp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vietrp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32k;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        limit_req zone=mfo_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Перезаписываем, а не дополняем — чтобы клиент не мог подменить IP для лимитов
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
